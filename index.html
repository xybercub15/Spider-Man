<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spiderverse</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10131a;
      color: #f2f4f8;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(680px, 88vw);
      padding: 42px;
      border: 1px solid #303746;
      border-radius: 18px;
      background: #171b24;
    }
    h1 { margin-top: 0; }
    .clue {
      margin-top: 28px;
      padding: 18px;
      border-left: 4px solid #e44;
      background: #11151d;
    }
  </style>
</head>
<body>
  <main>
    <h1>Spiderverse</h1>
    <p>A tiny fan page for people who never get tired of web-slingers.</p>

    <div class="clue">
      <strong>Favorite Spider-Man</strong>
      <p>Tom</p>
    </div>
  </main>
</body>
</html>
